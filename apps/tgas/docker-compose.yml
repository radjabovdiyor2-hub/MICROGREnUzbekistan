services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: microgreen
      POSTGRES_USER: mg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mg_secret_2024}
    volumes:
    - pg_data:/var/lib/postgresql/data
    - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U mg_user -d microgreen
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - mg_net
  redis:
    image: redis:7-alpine
    container_name: mg_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
    - redis_data:/data
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - mg_net
  web_office:
    build: .
    container_name: mg_web_office
    restart: unless-stopped
    command: python -m uvicorn web_office.main:app --host 0.0.0.0 --port 8050
    ports:
    - 8050:8050
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8050/')
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    networks:
    - mg_net
  stepan:
    build: .
    container_name: mg_stepan
    restart: unless-stopped
    command: python -m bots.stepan_bot.main
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:

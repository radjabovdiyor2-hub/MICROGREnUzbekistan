# ══════════════════════════════════════════════════════════════════════
# Мониторинг (DD §4.8).
#
# Форма Due Diligence фиксировала: «ELK/Grafana/Prometheus hali ulangan
# emas» — наблюдаемость держалась на docker-логах и heartbeat ботов.
# Этот файл добавляет метрики и дашборды, не трогая прод-стек.
#
# Запуск (вместе с основным compose):
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
#
# Все порты — только на 127.0.0.1: наружу ходить через SSH-туннель
#   ssh -L 3001:127.0.0.1:3001 user@server
# Это та же политика, что у postgres/redis/web_office в prod-стеке.
# ══════════════════════════════════════════════════════════════════════

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mg_prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 15 суток истории: этого хватает на разбор инцидента и недельные
      # тренды, а диск VPS не заполняется.
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Токен для scrape'а /api/metrics. Prometheus не подставляет env-переменные
      # в конфиг, поэтому читает его из файла. Файл создаёт оператор при
      # развёртывании (см. DEPLOY.md), в git он не попадает:
      #   printf '%s' "$METRICS_TOKEN" > deploy/monitoring/metrics_token
      - ./deploy/monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - mg_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: mg_grafana
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - prometheus
    environment:
      # Пароль обязателен: дефолтный admin/admin — это открытая панель
      # с оборотами и числом заказов.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - mg_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Метрики хоста: диск, память, CPU. Нужны, чтобы отличить «упало
  # приложение» от «кончилось место на VPS».
  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mg_node_exporter
    restart: unless-stopped
    mem_limit: 128m
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - mg_net

  # Метрики по контейнерам: какой бот течёт по памяти и кто перезапускается.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: mg_cadvisor
    restart: unless-stopped
    mem_limit: 256m
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - mg_net

volumes:
  prometheus_data:
  grafana_data:

networks:
  mg_net:
    external: true

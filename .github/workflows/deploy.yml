name: Deploy to server

# Авто-деплой на сервер при push в main (и вручную через кнопку Run workflow).
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST      — IP сервера
#   SSH_USER      — пользователь SSH (напр. root)
#   SSH_PASSWORD  — пароль сервера (ИЛИ используйте SSH_KEY — ключ надёжнее)
#   SSH_KEY       — приватный SSH-ключ (весь файл, с BEGIN/END) — приоритетнее пароля
#   DEPLOY_PATH   — путь к репозиторию на сервере (напр. /opt/microgreen)
#   SSH_PORT      — (необязательно) порт SSH, по умолчанию 22
# На сервере ОДИН раз: git clone, checkout main, заполнить .env-файлы (их нет в git),
# затем этот workflow будет обновлять код и пересобирать контейнеры.

# Manual-only. Auto-deploy on push to main is handled by ci.yml (quality-gated).
# Running both on push raced for the same server/containers and left one-shot
# containers (mg_db_push) in a conflicted state, breaking deploys.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Те же секреты, что и у ci.yml. Доставка была ТОЛЬКО там, и ручная
          # выкатка отсюда оставляла .env как есть: секрет, заданный в GitHub,
          # до сервера не доезжал, а деплой при этом выглядел успешным.
          # Ровно такая же однобокость и породила исходную поломку моста.
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: INGEST_SECRET,DGIS_API_KEY
          command_timeout: 30m
          script: |
            set -ex
            cd "${{ secrets.DEPLOY_PATH }}"

            # ── Секреты из GitHub Secrets в серверный .env ──
            # `set +x`: трассировка включена выше, иначе значение уйдёт в лог.
            set +x
            upsert_env() {
              key="$1"
              val="$2"
              if [ -z "$val" ]; then return 0; fi
              touch .env
              grep -v "^${key}=" .env > .env.next || true
              printf '%s=%s' "$key" "$val" >> .env.next
              echo >> .env.next
              mv .env.next .env
            }
            upsert_env INGEST_SECRET "$INGEST_SECRET"
            upsert_env DGIS_API_KEY "$DGIS_API_KEY"
            chmod 600 .env
            set -x

            # ── Ворота: с пустым общим секретом не выкатываемся ──
            missing=""
            for key in INGEST_SECRET BOT_SECRET; do
              value=$(grep "^${key}=" .env 2>/dev/null | head -1 | cut -d= -f2- || true)
              if [ -z "$value" ]; then missing="$missing $key"; fi
            done
            if [ -n "$missing" ]; then
              echo "❌ Пустые общие секреты в .env:$missing"
              echo "   Через них идёт всё сообщение витрины с ИИ-офисом."
              echo "   Задайте их в Settings → Secrets — доставка сюда автоматическая."
              exit 1
            fi

            echo "🔄 git pull…"
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
            echo "🧹 remove stale one-shot containers (avoid name conflicts)…"
            docker ps -aq -f "name=mg_db_push" | xargs -r docker rm -f || true
            docker ps -aq -f "name=mg_db_seed" | xargs -r docker rm -f || true
            echo "🏗  ensure infra is up…"
            docker compose -f docker-compose.prod.yml up -d postgres redis
            for i in $(seq 1 15); do
              docker compose -f docker-compose.prod.yml exec postgres \
                pg_isready -U mg_user -d microgreen && break
              echo "Waiting for postgres… ($i/15)"
              sleep 2
            done
            echo "📦 db-push…"
            docker compose -f docker-compose.prod.yml build db-push
            docker compose -f docker-compose.prod.yml run --rm --no-deps db-push
            echo "🌱 db-seed…"
            docker compose -f docker-compose.prod.yml run --rm --no-deps db-seed
            echo "🚀 build and start all services…"
            docker compose -f docker-compose.prod.yml up -d --build --no-deps web
            docker compose -f docker-compose.prod.yml up -d --build \
              web_office stepan sales support hr finance marketing \
              analytics content rnd devops n8n_bridge franchise bot
            # Update host system Nginx configs (if any) and Docker container Nginx to client_max_body_size 100M
            sudo sed -i 's/client_max_body_size [0-9]*[a-zA-Z]*;/client_max_body_size 100M;/g' /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* /etc/nginx/nginx.conf 2>/dev/null || true
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true
            sudo systemctl reload nginx 2>/dev/null || true
            sudo service nginx reload 2>/dev/null || true
            echo "📋 status:"
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f
            echo "✅ deploy done"

name: Deploy to server

# Авто-деплой на сервер при push в main (и вручную через кнопку Run workflow).
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SSH_HOST      — IP сервера
#   SSH_USER      — пользователь SSH (напр. root)
#   SSH_PASSWORD  — пароль сервера (ИЛИ используйте SSH_KEY — ключ надёжнее)
#   SSH_KEY       — приватный SSH-ключ (весь файл, с BEGIN/END) — приоритетнее пароля
#   DEPLOY_PATH   — путь к репозиторию на сервере (напр. /opt/microgreen)
#   SSH_PORT      — (необязательно) порт SSH, по умолчанию 22
# На сервере ОДИН раз: git clone, checkout main, заполнить .env-файлы (их нет в git),
# затем этот workflow будет обновлять код и пересобирать контейнеры.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "🔄 git pull…"
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
            echo "🏗  docker compose up -d --build…"
            docker compose -f docker-compose.prod.yml up -d --build
            echo "📋 status:"
            docker compose -f docker-compose.prod.yml ps
            echo "✅ deploy done"

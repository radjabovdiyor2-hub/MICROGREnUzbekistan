name: CI/CD — AgroTech Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/microgreen_test"

jobs:
  # ─────────────────────────── LINT & TYPE CHECK ───────────────────────────
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: cd packages/database && npx prisma generate && npm run build
      - run: cd apps/web && npx tsc --noEmit && npm run test

  python-quality:
    name: Python Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f apps/tgas/requirements.txt ]; then pip install -r apps/tgas/requirements.txt; fi
      - name: Run Ruff
        run: ruff check apps/tgas || true
      - name: Run Mypy
        run: mypy apps/tgas --ignore-missing-imports || true

  # ─────────────────────────── DEPLOY ───────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality, python-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 30
    # Serialize deploys: concurrent SSH sessions raced on the same containers
    # ("container name already in use"). Don't cancel in-progress — each deploy
    # git-resets to origin/main, so the queued one ships the newest code anyway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 28m
          script: |
            set -ex
            cd /opt/microgreen
            git fetch origin
            git reset --hard origin/main
            # Remove stale one-shot containers first. db-push/db-seed use fixed
            # names, so a leftover from a previous/aborted run makes compose fail
            # with "container name already in use" on recreate. The substring
            # match also catches compose's temp-renamed copies (<hash>_mg_db_push).
            docker ps -aq -f "name=mg_db_push" -f "name=mg_db_seed" | xargs -r docker rm -f || true
            # Stop web to free memory for build
            docker compose -f docker-compose.prod.yml stop web 2>/dev/null || true
            # Rebuild web (db-push runs as its dependency and applies the schema)
            docker compose -f docker-compose.prod.yml up -d --build web
            # Seed the storefront catalog ONLY if it is empty (self-skips when
            # already populated — never overwrites admin-edited prices/stock)
            docker compose -f docker-compose.prod.yml run --rm db-seed
            # Боты (apps/tgas) — без этого шага Python-изменения приезжали в git
            # на сервер, но продолжали крутиться старые контейнеры: деплой
            # пересобирал только web, а ботов не трогал вовсе.
            docker compose -f docker-compose.prod.yml up -d --build \
              web_office stepan sales support hr finance marketing \
              analytics content qa rnd devops n8n_bridge
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f

name: CI/CD — AgroTech Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/microgreen_test"

jobs:
  # ─────────────────────────── LINT & TYPE CHECK ───────────────────────────
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: cd packages/database && npx prisma generate && npm run build
      - run: cd apps/web && npx tsc --noEmit && npm run test

  python-quality:
    name: Python Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f apps/tgas/requirements.txt ]; then pip install -r apps/tgas/requirements.txt; fi
      - name: Run Ruff
        run: ruff check apps/tgas || true
      - name: Run Mypy
        run: mypy apps/tgas --ignore-missing-imports || true

  # ─────────────────────────── DEPLOY ───────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality, python-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 30
    # Serialize deploys: concurrent SSH sessions raced on the same containers
    # ("container name already in use"). Don't cancel in-progress — each deploy
    # git-resets to origin/main, so the queued one ships the newest code anyway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 28m
          script: |
            set -ex
            cd /opt/microgreen
            git fetch origin
            git reset --hard origin/main
            # Remove stale one-shot containers first. db-push/db-seed use fixed
            # names, so a leftover from a previous/aborted run makes compose fail
            # with "container name already in use" on recreate. Two separate
            # commands because docker ps ANDs multiple -f flags (not OR).
            docker ps -aq -f "name=mg_db_push" | xargs -r docker rm -f || true
            docker ps -aq -f "name=mg_db_seed" | xargs -r docker rm -f || true
            # Stop web + infra to free memory and release ports (5432, 6379).
            # Without this, Docker tries to recreate postgres while the old one
            # still holds port 5432, causing "address already in use".
            docker compose -f docker-compose.prod.yml stop web postgres redis 2>/dev/null || true
            sleep 2
            # Start infra only (postgres + redis)
            docker compose -f docker-compose.prod.yml up -d postgres redis
            # Wait for postgres to be healthy
            docker compose -f docker-compose.prod.yml exec postgres pg_isready -U mg_user -d microgreen || sleep 5
            # Run db-push: --no-deps prevents compose from recreating the
            # already-running postgres (which races on port 5432).
            docker compose -f docker-compose.prod.yml run --rm --no-deps db-push 2>&1 || {
              echo "=== db-push FAILED. Showing container logs: ==="
              docker logs mg_db_push 2>&1 || true
              exit 1
            }
            # Seed (self-skips when already populated)
            docker compose -f docker-compose.prod.yml run --rm --no-deps db-seed
            # Now build and start web (skip db-push dependency since it already ran)
            docker compose -f docker-compose.prod.yml up -d --build --no-deps web
            # Боты (apps/tgas) — без этого шага Python-изменения приезжали в git
            # на сервер, но продолжали крутиться старые контейнеры: деплой
            # пересобирал только web, а ботов не трогал вовсе.
            docker compose -f docker-compose.prod.yml up -d --build \
              web_office stepan sales support hr finance marketing \
              analytics content qa rnd devops n8n_bridge
            docker compose -f docker-compose.prod.yml ps
            docker image prune -f

name: CI/CD — AgroTech Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/microgreen_test"

jobs:
  # ─────────────────────────── LINT & TYPE CHECK ───────────────────────────
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Шага установки cairo/pango/jpeg/gif/rsvg здесь больше нет: он ставил
      # системные зависимости пакета `canvas`, которого нет ни в одном
      # package.json. Печатные QR рисует `qrcode` через `pngjs`, нативных
      # библиотек ему не нужно.

      - run: npm ci
      - run: cd packages/database && npx prisma generate && npm run build
      - run: cd apps/web && npm run lint
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/web && npx vitest run

  # ─────────────────────────── SECURITY ───────────────────────────
  # Форма Due Diligence (§7.5) числила проверку безопасности как ручную.
  # Два автоматических барьера, которых не хватало: утёкшие секреты и
  # уязвимые зависимости.
  security:
    name: Secrets & Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scan only commits in this push (not entire history).
      # Historical leaks are a known issue (SECURITY.md) requiring key rotation,
      # not blocking new deploys.
      # Блокирующий НАМЕРЕННО. Стояло `continue-on-error: true`, то есть
      # свежий токен, попавший в коммит, уезжал в прод вместе с ним, а
      # сканер лишь оставлял красную галочку, которую никто не открывает.
      # Историю он не смотрит (только коммиты этого пуша), поэтому старые
      # утечки из SECURITY.md выкатку не ломают: их чинит ротация ключей.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --ignore-scripts

      # Блокируем только critical. Единственные оставшиеся high — это sharp
      # 0.34.x (CVE-2026-33327/33328/35590/35591 в libvips): next 16.2.12
      # держит его как optionalDependency "^0.34.5", а исправление вышло
      # в 0.35, и npm-override этот вложенный экземпляр не перебивает.
      # Ставить high блокирующим сейчас — значит держать CI вечно красным
      # и приучить всех его игнорировать. Ограничение снимается, когда next
      # перейдёт на sharp ^0.35 (см. SECURITY.md, «Принятые риски»).
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=critical
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high || true

  python-quality:
    name: Python Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pyyaml
          if [ -f apps/tgas/requirements.txt ]; then pip install -r apps/tgas/requirements.txt; fi
      - name: Run Ruff
        run: ruff check apps/tgas
      # Витринный бот раньше не проверялся вовсе — там накопился 21 мёртвый
      # импорт, и «ruff чисто» относилось только к офису. Теперь набор
      # правил полный, как у офиса: `--select F` ловил только мёртвые имена
      # и пропускал импорты посреди файла и `try: ... except: pass` одной
      # строкой — то, из-за чего ошибку не видно при чтении.
      - name: Run Ruff (storefront bot)
        run: ruff check apps/bot
      # Стояло `mypy apps/tgas || true`, то есть не значило ничего.
      # Прогон по всему офису даёт 573 ошибки — почти все в обработчиках
      # aiogram; включить это целиком значит сделать CI вечно красным.
      # Поэтому проверка блокирующая, но по списку: единственные двери к
      # данным и машинерия вокруг них. Список растёт в check_types.py.
      - name: Run Mypy (двери к данным — блокирующая)
        run: python scripts/check_types.py
        working-directory: apps/tgas
      - name: Run compose invariant watchdog
        run: python scripts/check_compose.py
      # Переменная, которую код читает, но никто не объявил, — это функция,
      # молча выключенная в проде (так были обезоружены BACKUP_REMOTE_TARGET,
      # CRON_SECRET и AUDIT_LOG_DIR).
      - name: Run env declaration watchdog
        run: python scripts/check_env_declared.py
      # Числа в документах — не украшение: по ним ориентируются при
      # правках, и правило «перед созданием роута прочитай список групп»
      # отправляет читать именно их. К моменту ревизии разошлись шесть
      # утверждений из восьми; ручная сверка отстаёт всегда.
      - name: Run docs numbers watchdog
        run: python scripts/check_docs_numbers.py
      # Ниже — проверки, которые CLAUDE.md требует прогонять перед «готово»,
      # но CI не запускал ни одну: они существовали только как ручная команда.
      # Именно поэтому check_prompts мог месяцами не видеть половины нарушений —
      # его никто не запускал, а значит, никто и не замечал, что он ослеп.
      - name: Run tgas tests
        run: python -m pytest tests/ -q
        working-directory: apps/tgas
      - name: Run storefront bot tests
        run: python -m pytest tests/ -q
        working-directory: apps/bot
      - name: Run static cross-checks
        working-directory: apps/tgas
        run: |
          python scripts/check_schema.py
          python scripts/check_tools.py
          python scripts/check_bot_roster.py
          python scripts/check_prompts.py
          python scripts/check_imports.py

  # ─────────────────────────── E2E ───────────────────────────
  # Шесть сценариев Playwright (auth, checkout, homepage, profile, shop) и
  # готовый playwright.config.ts лежали в репозитории, но ни один workflow их
  # не запускал: проверка оформления заказа существовала только на бумаге.
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        # Не `postgres:15`: в схеме есть knowledge_base.embedding типа
        # Unsupported("vector(1536)"), и на образе без pgvector `prisma db push`
        # обрывается на CREATE TABLE с `type "vector" does not exist`. Весь job
        # умирал за минуту, до единого сценария. Прод (docker-compose.prod.yml)
        # работает на pgvector/pgvector:pg16 — стенд должен совпадать с ним,
        # а не с локальным docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: microgreen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Образ несёт расширения, но не включает их — CREATE EXTENSION живёт
      # в базе, а не в образе. vector нужен самому db push (см. выше), pg_trgm —
      # migrations/manual/2026-08-customer-search.sql, который накатывает деплой:
      # без него нечёткий проход поиска молча выключен, и стенд врал бы о нём.
      - name: Enable Postgres extensions
        run: psql "$DATABASE_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;'
      - run: cd packages/database && npx prisma generate && npx prisma db push --skip-generate
      # Пустая база — пустой каталог. Три сценария («каталог показывает товары»,
      # «поиск принимает ввод», «catalog link navigates to catalog») ждут ссылку
      # /product/<id> и без сидера падают по таймауту: выглядит как поломка
      # витрины, хотя витрине просто нечего показывать.
      - run: cd packages/database && npm run db:seed
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: cd apps/web && npm run build
      # Свой сервер поднимает сам playwright.config.ts, когда
      # PLAYWRIGHT_BASE_URL не задан.
      #
      # ОБА ПРОФИЛЯ, а не только широкое окно. Мобильный стоил 19 секунд и
      # сразу нашёл то, чего chromium не видел: в pos-from-map ящик вкладок
      # не успевал смонтироваться, проверка видимости честно отвечала «нет»,
      # и нажатие уходило во вкладку за левым краем экрана. Playwright
      # уехавший за край элемент считает видимым, поэтому сценарий рвался
      # позже и в другом месте.
      #
      # Это не единичный случай: у обоих сценариев админки, написанных
      # порознь, ошибка оказалась одна и та же. А админкой в поле
      # пользуются именно с телефона — проверять её только на десктопе
      # значит проверять не то устройство.
      - run: cd apps/web && npx playwright test --project=chromium --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ─────────────────────────── BUILD IMAGES ───────────────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [quality, python-quality, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push mg-tgas
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/tgas/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mg-tgas:latest
            ghcr.io/${{ github.repository_owner }}/mg-tgas:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Инструменты для db-push и db-seed. Раньше эти два одноразовых шага
      # обслуживала builder-стадия apps/web (образ mg-web-builder ~4 ГБ):
      # полный node_modules монорепозитория ехал на сервер каждую выкатку ради
      # `prisma db push` и сидера. Теперь — 501 МБ ровно с тем, что им нужно.
      - name: Build and push mg-db-tools
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/database/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mg-db-tools:latest
            ghcr.io/${{ github.repository_owner }}/mg-db-tools:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push mg-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mg-web:latest
            ghcr.io/${{ github.repository_owner }}/mg-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push mg-bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mg-bot:latest
            ghcr.io/${{ github.repository_owner }}/mg-bot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────── DEPLOY ───────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # E2E ЗДЕСЬ НАМЕРЕННО. Он не входил в зависимости выкатки, то есть
    # сценарии оформления заказа и входа могли падать, а прод обновлялся:
    # проверка, которая ничего не останавливает, — это отчёт, а не гейт.
    needs: [quality, python-quality, security, e2e, build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # Час, а не полчаса: бюджет считается от худшего канала (см. pull ниже),
    # а не от типичного. Обычный деплой как занимал три минуты, так и занимает —
    # запас простаивает и ничего не стоит.
    timeout-minutes: 60
    # Serialize deploys: concurrent SSH sessions raced on the same containers
    # ("container name already in use"). Don't cancel in-progress — each deploy
    # git-resets to origin/main, so the queued one ships the newest code anyway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          MG_TAG: sha-${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          # Общие секреты приезжают из репозитория, а не заводятся руками на
          # сервере. `.env` не в git и переживает `git reset --hard`, поэтому
          # раньше он был единственным местом, где значение могло потеряться
          # при переустановке — и потерялось: пустой INGEST_SECRET закрыл
          # офис для витрины целиком, включая зеркало заказов.
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: MG_TAG,GHCR_OWNER,INGEST_SECRET,DGIS_API_KEY
          command_timeout: 50m
          script: |
            set -ex
            export MG_TAG=$MG_TAG
            export GHCR_OWNER=$GHCR_OWNER
            cd /opt/microgreen
            git fetch origin
            git reset --hard origin/main

            # ── Секреты из GitHub Secrets в серверный .env ──
            #
            # `set +x` обязателен: трассировка включена выше, и без неё
            # значение секрета ушло бы в открытый лог сборки.
            #
            # Переписываем строку целиком через фильтр, а не `sed -i s|...|`:
            # значение произвольное, и в нём могут оказаться символы, которые
            # sed примет за свои.
            set +x
            upsert_env() {
              key="$1"
              val="$2"
              if [ -z "$val" ]; then return 0; fi
              touch .env
              grep -v "^${key}=" .env > .env.next || true
              # printf без перевода строки + пустой echo: так в записи нет ни
              # одного экранирования, и произвольное значение секрета не может
              # быть истолковано как управляющая последовательность.
              printf '%s=%s' "$key" "$val" >> .env.next
              echo >> .env.next
              mv .env.next .env
            }
            upsert_env INGEST_SECRET "$INGEST_SECRET"
            upsert_env DGIS_API_KEY "$DGIS_API_KEY"
            chmod 600 .env
            set -x

            # ── Ворота: с пустым общим секретом не выкатываемся ──
            #
            # web_office при ENVIRONMENT=production отвечает 401 на КАЖДЫЙ
            # /ingest/*, если секрет пуст. Витрина эту ошибку гасит намеренно,
            # поэтому сайт выглядит здоровым, а заказы не доезжают до CRM —
            # так и жило незамеченным. Инструкция в DEPLOY.md выкатку не
            # останавливает, ненулевой код возврата останавливает.
            #
            # Стоит ДО `docker compose pull`: отказ должен занимать секунды,
            # а не двенадцать минут скачивания образов.
            missing=""
            for key in INGEST_SECRET BOT_SECRET; do
              value=$(grep "^${key}=" .env 2>/dev/null | head -1 | cut -d= -f2- || true)
              if [ -z "$value" ]; then missing="$missing $key"; fi
            done
            if [ -n "$missing" ]; then
              echo "❌ Пустые общие секреты в .env:$missing"
              echo "   Через них идёт всё сообщение витрины с ИИ-офисом:"
              echo "   зеркало заказов, синхронизация статусов, карточки клиентов,"
              echo "   геокодирование карты, управление ботами из админки."
              echo "   INGEST_SECRET и DGIS_API_KEY задаются в Settings → Secrets"
              echo "   и попадают сюда сами. Остальные — в /opt/microgreen/.env."
              exit 1
            fi
            # Скачиваем образы ПЕРВЫМ делом — до того, как что-либо тронуто.
            # Пакеты в GHCR приватные: если разовый `docker login ghcr.io` на
            # сервере не сделан (или PAT протух), pull вернёт denied. Под set -e
            # это обрывает скрипт, и место обрыва решает многое — стоя после
            # unify_databases.sql, pull ронял бы деплой уже ПОСЛЕ переименования
            # таблиц, оставляя стек лежать на полпути с мигрированной базой.
            #
            # Три попытки с ограничением каждой, а не одна команда на весь
            # бюджет сессии. 15 августа канал сервера до ghcr.io просел с
            # 17 МБ/с до 0.35 МБ/с (замерено по прогонам #345 и #348), и 636 МБ
            # новых слоёв перестали помещаться в отведённое время. Одиночный
            # pull в такой ситуации не двигает деплой НИКОГДА: его убивают
            # вместе со всей SSH-сессией, слои в полёте теряются, и следующий
            # деплой начинает с того же места. Докачанные слои, наоборот,
            # остаются в локальном хранилище — поэтому попытки накапливают
            # прогресс, и медленный канал перестаёт быть вечной красной сборкой.
            # Два прогона подряд, #346 и #348, сгорели ровно на этом.
            df -h /var/lib/docker || true
            pull_ok=""
            for attempt in 1 2 3; do
              if timeout 12m docker compose -f docker-compose.prod.yml pull; then
                pull_ok="yes"
                break
              fi
              echo "⚠️  попытка $attempt: pull не уложился в 12 минут; скачанные слои сохранены, повторяем"
            done
            if [ -z "$pull_ok" ]; then
              echo "❌ образы не скачались за три попытки — смотреть канал до ghcr.io и место на диске:"
              df -h /var/lib/docker || true
              exit 1
            fi
            # Remove stale one-shot containers first. db-push/db-seed use fixed
            # names, so a leftover from a previous/aborted run makes compose fail
            # with "container name already in use" on recreate. Two separate
            # commands because docker ps ANDs multiple -f flags (not OR).
            docker ps -aq -f "name=mg_db_push" | xargs -r docker rm -f || true
            docker ps -aq -f "name=mg_db_seed" | xargs -r docker rm -f || true
            # Ensure infra is up (first deploy / server reboot).
            # postgres has no host port mapping, so recreation is safe.
            docker compose -f docker-compose.prod.yml up -d postgres redis
            # Wait for postgres to be healthy (proper retry, not one-shot check)
            for i in $(seq 1 15); do
              docker compose -f docker-compose.prod.yml exec postgres \
                pg_isready -U mg_user -d microgreen && break
              echo "Waiting for postgres… ($i/15)"
              sleep 2
            done
            # ── Снимок базы перед необратимыми шагами ─────────────────────
            #
            # Ниже два шага меняют СХЕМУ боевой базы без участия человека:
            # unify_databases.sql переименовывает таблицы, а db-push идёт с
            # `--accept-data-loss`. Почему снимок обязателен и почему его
            # отказ обрывает выкатку — в самом скрипте.
            #
            # Скрипт, а не двадцать строк здесь: тот же снимок нужен перед
            # `relink_pos_sales --apply` (workflow relink-pos-sales.yml), а
            # вторая копия проверки целостности разошлась бы с первой молча.
            #
            # Файл на месте: выше уже прошёл `git reset --hard origin/main`.
            sh deploy/db-snapshot.sh "$(echo "${MG_TAG#sha-}" | cut -c1-7)"

            # Unified DB migration: rename conflicting CRM tables → crm_* and
            # clean up constraints so Prisma db-push can run cleanly.
            MIGRATION_SQL="packages/database/prisma/migrations/unify_databases.sql"
            if [ -f "$MIGRATION_SQL" ]; then
              echo "🔧 Running unify_databases.sql migration..."
              docker cp "$MIGRATION_SQL" mg_postgres:/tmp/unify_databases.sql
              docker exec mg_postgres psql -U mg_user -d microgreen -f /tmp/unify_databases.sql
            fi
            # Run db-push: --no-deps prevents compose from recreating the
            # already-running postgres (which races on port 5432).
            docker compose -f docker-compose.prod.yml run --rm --no-deps db-push 2>&1 || {
              echo "=== db-push FAILED. Showing container logs: ==="
              docker logs mg_db_push 2>&1 || true
              exit 1
            }
            # Поиск «как назвал человек»: pg_trgm + триграммные индексы.
            #
            # Расширение создавалось только в apps/tgas/database/init.sql, а он
            # исторический и в прод не монтируется. На базе, поднятой Prisma с
            # нуля, pg_trgm нет — и нечёткий проход поиска (опечатки) молча
            # выключен и у товаров, и у клиентов: код ловит исключение, пишет
            # warning и остаётся без третьего прохода.
            #
            # После db-push, потому что индексы ложатся на таблицы, которыми
            # владеет Prisma. Файл idempotent. Отдельным psql -f, БЕЗ
            # --single-transaction: CREATE INDEX CONCURRENTLY внутри транзакции
            # не выполняется.
            SEARCH_SQL="packages/database/prisma/migrations/manual/2026-08-customer-search.sql"
            if [ -f "$SEARCH_SQL" ]; then
              echo "🔧 Running search indexes migration (pg_trgm)..."
              docker cp "$SEARCH_SQL" mg_postgres:/tmp/search-indexes.sql
              docker exec mg_postgres psql -U mg_user -d microgreen -f /tmp/search-indexes.sql
            fi
            # Seed (self-skips when already populated)
            docker compose -f docker-compose.prod.yml run --rm --no-deps db-seed
            # Now start web (skip db-push dependency since it already ran)
            docker compose -f docker-compose.prod.yml up -d --no-deps web
            # Боты (apps/tgas) — без этого шага Python-изменения приезжали в git
            # на сервер, но продолжали крутиться старые контейнеры.
            # Теперь мы просто делаем up -d (без --build, т.к. образы уже скачаны pull).
            docker compose -f docker-compose.prod.yml up -d \
              web_office stepan sales support hr finance marketing \
              analytics content qa rnd devops n8n_bridge franchise bot
            # One-time: migrate content_status.json → PostgreSQL (no-op if already done)
            docker exec mg_content python scripts/migrate_content_status.py 2>/dev/null || true
            # Update host system Nginx configs (if any) and Docker container Nginx to client_max_body_size 100M
            sudo sed -i 's/client_max_body_size [0-9]*[a-zA-Z]*;/client_max_body_size 100M;/g' /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* /etc/nginx/nginx.conf 2>/dev/null || true
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || true
            sudo systemctl reload nginx 2>/dev/null || true
            sudo service nginx reload 2>/dev/null || true
            docker compose -f docker-compose.prod.yml ps
            # ── Дым: сайт действительно поднялся ───────────────────────
            #
            # Успехом выкатки считался вывод `docker compose ps` — то есть
            # «контейнеры запущены». Контейнер, который поднялся и падает на
            # каждом запросе, выглядит там точно так же, и владелец узнавал
            # о поломке от клиента.
            #
            # `?ready=1` — это не пинг: роут ходит в базу и отвечает 503,
            # если её нет. Двенадцать попыток по 5 секунд: столько нужно
            # Next на прогрев после старта.
            #
            # Порт 3002, а не 3000: на этой машине 3000 и 3001 заняты чужими
            # проектами, и web опубликован как 127.0.0.1:3002 (см.
            # docker-compose.prod.yml). Проверка на 3000 молча стучалась бы
            # в соседний проект и зеленела бы независимо от нашей выкатки.
            ok=""
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5                 http://127.0.0.1:3002/api/health?ready=1 || true)
              if [ "$code" = "200" ]; then ok="yes"; break; fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "::error::Витрина не отвечает готовностью после выкатки (последний код: $code)"
              docker compose -f docker-compose.prod.yml logs --tail=50 web
              exit 1
            fi
            echo "Витрина готова: /api/health?ready=1 → 200"
            # Наши образы помечены постоянным тегом sha-<коммит>, поэтому при
            # следующем деплое они НЕ становятся dangling и `image prune -f` их
            # не видит: без явного rmi поколения копятся, и диск кончится так
            # же, как он уже кончался от кэша buildkit. Этот же проход уносит
            # оставшиеся mg-web-builder — прод на них больше не работает,
            # db-push и db-seed переехали на mg-db-tools.
            # Удаляем только свой неймспейс: на машине живут чужие проекты.
            # Откат это не ломает — MG_TAG=sha-<старый> дотянет образ из GHCR.
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep "^ghcr.io/${GHCR_OWNER}/" \
              | grep -v ":${MG_TAG}$" \
              | xargs -r -n1 docker rmi 2>/dev/null || true
            docker image prune -f


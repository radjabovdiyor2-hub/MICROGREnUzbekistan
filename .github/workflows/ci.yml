name: CI/CD — AgroTech Ecosystem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/microgreen_test"

jobs:
  # ─────────────────────────── LINT & TYPE CHECK ───────────────────────────
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: cd packages/database && npx prisma generate && npm run build
      - run: cd apps/web && npx tsc --noEmit && npm run test

  python-quality:
    name: Python Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          if [ -f apps/tgas/requirements.txt ]; then pip install -r apps/tgas/requirements.txt; fi
      - name: Run Ruff
        run: ruff check apps/tgas || true
      - name: Run Mypy
        run: mypy apps/tgas --ignore-missing-imports || true

  # ─────────────────────────── DEPLOY ───────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality, python-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 20
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 18m
          script: |
            set -ex
            cd /home/ubuntu/MICROGREnUzbekistan
            git fetch origin
            git reset --hard origin/main
            chmod +x deploy/deploy.sh
            bash deploy/deploy.sh

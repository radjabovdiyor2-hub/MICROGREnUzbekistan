# ══════════════════════════════════════════════════════════════════════
# Кассовые чеки — вернуть настоящим клиентам.
#
# ЗАЧЕМ ОТДЕЛЬНАЯ КНОПКА
#
# `apps/tgas/scripts/relink_pos_sales.py` чинит последствие старого дефекта:
# касса витрины писала покупателя в `pos_sales.customer_id`, но в зеркало
# офиса его не передавала — там стояло захардкоженное «Покупатель в
# магазине». Все продажи за прилавком скопились на одной фиктивной
# карточке, а у настоящих клиентов не двигались ни счётчики, ни история, ни
# точка на карте.
#
# Запустить его может только тот, у кого есть доступ к серверу. Владелец
# при этом обязан сперва УВИДЕТЬ отчёт: какие чеки к каким клиентам
# вернутся. Здесь и то и другое — из интерфейса Actions, без ssh-клиента.
#
# ПОЧЕМУ НЕ В ВЫКАТКЕ
#
# Это одноразовая операция над данными, а не часть сборки. В выкатке она
# исполнялась бы на каждом мерже — и однажды не тогда, когда надо.
#
# КАК ЗАПУСКАТЬ
#
#   Actions → «Кассовые чеки — вернуть настоящим клиентам» → Run workflow
#
# По умолчанию сухой прогон: печатает отчёт и НИЧЕГО не меняет. Для записи
# нужно выбрать «Применить» И вписать слово-подтверждение — одного
# выпадающего списка мало, по нему промахиваются.
# ══════════════════════════════════════════════════════════════════════
name: Кассовые чеки — вернуть настоящим клиентам

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Что делать"
        type: choice
        default: "Сухой прогон — только отчёт"
        options:
          - "Сухой прогон — только отчёт"
          - "Применить — записать в базу"
      confirm:
        description: "Только для «Применить»: впишите ПРИМЕНИТЬ"
        type: string
        required: false
        default: ""

# Две записи разом переписали бы одни и те же строки. Ждём, а не отменяем:
# отменённый посередине прогон оставил бы половину работы.
concurrency:
  group: relink-pos-sales
  cancel-in-progress: false

jobs:
  relink:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    steps:
      # Ворота ДО связи с сервером: промах в выпадающем списке не должен
      # доходить до базы даже попыткой.
      - name: Проверить подтверждение
        if: startsWith(inputs.mode, 'Применить')
        run: |
          if [ "${{ inputs.confirm }}" != "ПРИМЕНИТЬ" ]; then
            echo "❌ Выбрано «Применить», но поле подтверждения не заполнено."
            echo "   Впишите ровно: ПРИМЕНИТЬ"
            echo "   Ничего не запущено, база не тронута."
            exit 1
          fi
          echo "Подтверждение принято."

      - name: Запустить на сервере
        uses: appleboy/ssh-action@v1
        env:
          # Строку решения передаём как есть: ветвление живёт в скрипте
          # ниже, а не в выражениях YAML — их не видно в логе прогона.
          RELINK_MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELINK_MODE
          command_timeout: 30m
          script: |
            set -e
            cd /opt/microgreen

            case "$RELINK_MODE" in
              Применить*) APPLY=1 ;;
              *)          APPLY=0 ;;
            esac

            if [ "$APPLY" = "1" ]; then
              # Снимок ПЕРЕД записью: скрипт переписывает привязку чеков и
              # пересчитывает счётчики карточек. Тот же снимок, что у
              # выкатки, — одна реализация, одна проверка целостности.
              sh deploy/db-snapshot.sh relink
              echo "── ЗАПИСЬ ─────────────────────────────────────────────"
              docker exec mg_web_office python -m scripts.relink_pos_sales --apply
            else
              echo "── СУХОЙ ПРОГОН: база не меняется ─────────────────────"
              docker exec mg_web_office python -m scripts.relink_pos_sales
            fi

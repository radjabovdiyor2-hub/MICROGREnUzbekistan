# gitleaks config — секрет-скан перед пушем / в CI.
# Запуск:  gitleaks detect --config .gitleaks.toml --no-banner
#          gitleaks protect --staged --config .gitleaks.toml   # только застейдженное
#
# История репозитория была публичной и содержит утёкшие ключи (см. SECURITY.md).
# Эта конфигурация ловит НОВЫЕ утечки; для истории требуется ротация ключей.

title = "Microgreen Uzbekistan secret scan"

[extend]
# Наследуем встроенный набор правил gitleaks (AWS, Google, generic API keys и т.д.)
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram Bot API token"
regex = '''\b\d{8,10}:[A-Za-z0-9_-]{35}\b'''
keywords = ["bot", "token", "telegram"]

[[rules]]
id = "postgres-url-with-password"
description = "Postgres connection string with inline password"
regex = '''postgres(?:ql)?://[^:@/\s]+:[^@/\s]+@[^\s'"]+'''
keywords = ["postgres", "postgresql"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''\bsk-[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-"]

[[rules]]
id = "meta-graph-token"
description = "Facebook/Instagram Graph long-lived access token"
regex = '''\bEA[A-Za-z0-9]{80,}\b'''
keywords = ["access_token", "EA"]

[allowlist]
description = "Пути и плейсхолдеры, которые не считаем утечкой"
paths = [
    # ВАЖНО: раньше здесь стоял шаблон по имени — '''(^|/)\.env\.example$''' —
    # то есть скан молчал про ЛЮБОЙ файл с таким именем. А в
    # apps/web/.env.example лежат боевые ключи (Telegram-токен, Gemini,
    # DATABASE_URL с паролем): он не отслеживается git, но попади он в
    # коммит — gitleaks бы это пропустил. Теперь перечислены только два
    # реально отслеживаемых файла, содержимое которых проверено (плейсхолдеры).
    '''^\.env\.example$''',
    '''^apps/tgas/\.env\.example$''',
    '''(^|/)node_modules/''',
    '''(^|/)\.git/''',
    '''(^|/)package-lock\.json$''',
    '''(^|/)pnpm-lock\.yaml$''',
    # Сгенерированные HTML/CSS с base64-картинками и шрифтами: правило
    # meta-graph-token ловит в них длинные строки, начинающиеся с EA.
    '''^content/generated/''',
    '''^content/templates/fonts/''',
    '''(^|/)playwright-report/''',
]
regexes = [
    '''(?i)(your[_-]?token|placeholder|example|changeme|xxxx+|<[^>]+>)''',
]

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Нет связи</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, -apple-system, sans-serif;
        background: #0f1511;
        color: #e8f0ea;
        padding: 24px;
      }
      .box { max-width: 340px; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { margin: 0 0 16px; color: #b6c7bb; }
      button {
        font: inherit;
        padding: 12px 20px;
        border: 0;
        border-radius: 10px;
        background: #10b981;
        color: #06231a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!--
      ЧЕСТНАЯ СТРАНИЦА ВМЕСТО ОШИБКИ БРАУЗЕРА.
      Без неё человек в поле видит системное «ERR_INTERNET_DISCONNECTED» и
      решает, что сломалось приложение. Здесь сказано главное: маршрут в
      это время НЕ ТЕРЯЕТСЯ — он копится и уйдёт, когда связь вернётся.
    -->
    <div class="box">
      <h1>Нет связи с сервером</h1>
      <p>
        Маршрут при этом записывается и хранится в телефоне — он уйдёт сам,
        как только появится сеть. Ничего не потеряется.
      </p>
      <button type="button" onclick="location.reload()">Попробовать снова</button>
    </div>
  </body>
</html>

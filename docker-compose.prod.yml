services:
  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://microgreen:${POSTGRES_PASSWORD}@postgres:5432/microgreen_db
      - NEXT_PUBLIC_URL=https://microgreenuzbekistan.com
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres
    restart: always
    networks:
      - microgreen

  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WEB_APP_URL=https://microgreenuzbekistan.com/webapp
      - WEB_API_URL=https://microgreenuzbekistan.com/api
      - ADMIN_CHAT_ID=${ADMIN_CHAT_ID}
      - DATABASE_URL=postgresql://microgreen:${POSTGRES_PASSWORD}@postgres:5432/microgreen_db
    depends_on:
      - postgres
    restart: always
    networks:
      - microgreen

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: microgreen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: microgreen_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - microgreen
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U microgreen -d microgreen_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - microgreen

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: always
    networks:
      - microgreen

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:


networks:
  microgreen:
    driver: bridge

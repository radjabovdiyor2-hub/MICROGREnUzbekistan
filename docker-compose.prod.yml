# ============================================================================
#  Microgreen Uzbekistan — UNIFIED production stack
#  Website (Next.js + /api) + storefront bot (Gemini) + 13 internal AI bots
#  (tgas, OpenAI) + web_office, on one Postgres (two DBs) + Redis.
#
#  Two databases in one Postgres instance:
#    - microgreen     -> tgas CRM   (seeded by apps/tgas/database/init.sql)
#    - microgreen_db  -> storefront (Prisma db push, service `db-push`)
#
#  Bring up:   docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

# --- shared config for every internal tgas bot -----------------------------
x-tgas-bot: &tgas-bot
  build:
    context: ./apps/tgas
  restart: unless-stopped
  mem_limit: 320m
  env_file: ./apps/tgas/.env
  environment:
    DATABASE_URL: postgresql+asyncpg://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
    REDIS_URL: redis://redis:6379/0
    # Shared secret guarding web_office's /ingest/order bridge (empty = off).
    INGEST_SECRET: ${INGEST_SECRET:-}
    # Reverse sync: office dashboard status change -> storefront + customer.
    STOREFRONT_STATUS_URL: http://web:3000/api/orders/status
    # Catalog sync: pull the storefront catalog (master) into the office mirror.
    STOREFRONT_API_URL: http://web:3000/api
    BOT_SECRET: ${BOT_SECRET:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - bus_tasks:/app/bus_tasks
  networks:
    - mg_net
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ========================= INFRASTRUCTURE ===============================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mg_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: mg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: microgreen
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/db-init/00_create_storefront_db.sh:/docker-entrypoint-initdb.d/00_create_storefront_db.sh:ro
      - ./apps/tgas/database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mg_user -d microgreen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mg_net

  redis:
    image: redis:7-alpine
    container_name: mg_redis
    restart: unless-stopped
    mem_limit: 192m
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mg_net

  # One-shot: push the Prisma schema into microgreen_db, then exit.
  db-push:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    container_name: mg_db_push
    working_dir: /app
    command: sh -c "npx prisma db push --schema=packages/database/prisma/schema.prisma --skip-generate --accept-data-loss"
    environment:
      DATABASE_URL: postgresql://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen_db
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - mg_net

  # ========================= WEBSITE ======================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mg_web
    restart: unless-stopped
    mem_limit: 768m
    # Published only on loopback — the server's existing system nginx proxies
    # microgreenuzbekistan.com -> 127.0.0.1:3002 (порты 3000/3001 заняты другими
    # проектами на этом сервере, поэтому наш сайт на 3002; не трогает 80/443).
    ports:
      - "127.0.0.1:3002:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen_db
      REDIS_URL: redis://redis:6379/0
      NEXT_PUBLIC_URL: https://microgreenuzbekistan.com
      UPLOADS_DIR: /data/uploads
      # Bridge app orders/customers into the tgas AI-office CRM (`microgreen` DB).
      OFFICE_INGEST_URL: http://web_office:8050/ingest/order
      OFFICE_STATUS_URL: http://web_office:8050/ingest/order-status
      OFFICE_CUSTOMER_URL: http://web_office:8050/ingest/customer
      INGEST_SECRET: ${INGEST_SECRET:-}
      # Shared secret for storefront-bot -> web admin API calls (empty = off).
      BOT_SECRET: ${BOT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      # Persist + serve uploaded product images (host dir, kept across deploys).
      - ${HOST_UPLOADS_DIR:-/home/ubuntu/microgreen-uploads}:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mg_net

  # Customer-facing storefront bot (aiogram + Gemini) — the only client bot.
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: mg_storefront_bot
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen_db
      WEB_API_URL: http://web:3000/api
      # Must match the web service's BOT_SECRET so admin API calls authorize.
      BOT_SECRET: ${BOT_SECRET:-}
      # Степан-менеджер (@MG_PM1_bot) — для уведомлений о заказах
      STEPAN_BOT_TOKEN: ${PM_BOT_TOKEN:-}
    depends_on:
      web:
        condition: service_started
    networks:
      - mg_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ========================= tgas — INTERNAL AI OFFICE ====================
  web_office:
    <<: *tgas-bot
    container_name: mg_web_office
    command: python -m uvicorn web_office.main:app --host 0.0.0.0 --port 8050
    ports:
      - "127.0.0.1:8050:8050"

  stepan:
    <<: *tgas-bot
    container_name: mg_stepan
    command: python -m bots.stepan_bot.main

  sales:
    <<: *tgas-bot
    container_name: mg_sales
    command: python -m bots.sales_bot.main

  support:
    <<: *tgas-bot
    container_name: mg_support
    command: python -m bots.support_bot.main

  hr:
    <<: *tgas-bot
    container_name: mg_hr
    command: python -m bots.hr_bot.main

  finance:
    <<: *tgas-bot
    container_name: mg_finance
    command: python -m bots.finance_bot.main

  marketing:
    <<: *tgas-bot
    container_name: mg_marketing
    command: python -m bots.marketing_bot.main

  analytics:
    <<: *tgas-bot
    container_name: mg_analytics
    command: python -m bots.analytics_bot.main

  content:
    <<: *tgas-bot
    container_name: mg_content
    command: python -m bots.content_bot.main

  qa:
    <<: *tgas-bot
    container_name: mg_qa
    command: python -m bots.qa_bot.main

  rnd:
    <<: *tgas-bot
    container_name: mg_rnd
    command: python -m bots.rnd_bot.main

  # devops needs the Docker socket + backups dir (overrides anchor volumes)
  devops:
    <<: *tgas-bot
    container_name: mg_devops
    command: python -m bots.devops_bot.main
    volumes:
      - bus_tasks:/app/bus_tasks
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock

  # n8n_bridge reaches an (optional) external n8n on the host
  n8n_bridge:
    <<: *tgas-bot
    container_name: mg_n8n_bridge
    command: python -m bots.n8n_bridge.main
    environment:
      DATABASE_URL: postgresql+asyncpg://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
      REDIS_URL: redis://redis:6379/0
      N8N_ASSISTANT_WEBHOOK: http://host.docker.internal:5678/webhook/assistant
      N8N_TIMEOUT: "120"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ========================= EDGE (nginx + TLS) ===========================
  # Opt-in only: `docker compose --profile edge up -d`.
  # On the shared multi-tenant server the system nginx already owns 80/443,
  # so by default we DON'T start these (web is reached via 127.0.0.1:3000).
  nginx:
    image: nginx:alpine
    container_name: mg_nginx
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - mg_net

  certbot:
    image: certbot/certbot
    container_name: mg_certbot
    profiles: ["edge"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pg_data:
  redis_data:
  bus_tasks:

networks:
  mg_net:
    driver: bridge

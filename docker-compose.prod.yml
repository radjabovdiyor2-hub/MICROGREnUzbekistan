# ============================================================================
#  Microgreen Uzbekistan — UNIFIED production stack
#  Website (Next.js + /api) + storefront bot (Gemini) + 13 internal AI bots
#  (tgas, OpenAI) + web_office, on one Postgres (single DB) + Redis.
#
#  Single database: microgreen
#    - Prisma owns the schema (packages/database/prisma/schema.prisma)
#    - init.sql is retired; tables managed by Prisma db push
#    - CRM tables use crm_* prefix where names conflict with web tables
#
#  Образы собираются в CI (job build-images) и лежат в GHCR. Сервер их только
#  скачивает — `--build` на нём больше не запускается: именно неограниченная
#  сборка витрины (npm install + next build, 1,5–2,5 ГБ) съедала память
#  4-гигабайтной машины и приводила к OOM.
#
#  Bring up:   docker compose -f docker-compose.prod.yml pull
#              docker compose -f docker-compose.prod.yml up -d
#
#  ⚠️ Пакеты в GHCR приватные, поэтому на сервере нужен разовый логин
#  (PAT со скоупом read:packages, сохраняется в ~/.docker/config.json):
#      echo <PAT> | docker login ghcr.io -u <github-user> --password-stdin
#  Без него `pull` вернёт denied, и деплой встанет. Токен вводить только на
#  сервере: через CI он бы попал в лог Actions, там включён `set -x`.
# ============================================================================

# --- shared config for every internal tgas bot -----------------------------
x-tgas-bot: &tgas-bot
  # Один образ на все 14 сервисов офиса — они и так различаются только `command:`.
  #
  # Без явного `image:` compose даёт каждому сервису собственное имя образа и
  # собирает ОДИН И ТОТ ЖЕ Dockerfile четырнадцать раз подряд. Пока правки шли
  # мимо apps/tgas, спасал кэш слоёв; стоило тронуть shared/ — кэш сбрасывался
  # у всех сразу, и деплой не укладывался в отведённые ему 28 минут (прогон
  # #318 упал именно по таймауту). Теперь сборка одна, остальные тринадцать
  # сервисов переиспользуют готовый образ.
  image: ghcr.io/${GHCR_OWNER:-radjabovdiyor2-hub}/mg-tgas:${MG_TAG:-latest}
  build:
    # Контекст — корень репозитория, чтобы образы офиса видели общий пакет
    # packages/mg_ai. Следствие: применяется корневой .dockerignore, а
    # apps/tgas/.dockerignore — нет; его исключения перенесены в корневой.
    context: .
    dockerfile: apps/tgas/Dockerfile
  restart: unless-stopped
  # ПОТОЛОК, А НЕ БРОНЬ. При превышении cgroup убивает процесс ВНУТРИ контейнера,
  # поэтому лимит ниже реального потребления превращает «работает» в
  # «перезапускается по кругу».
  #
  # Значение ИЗМЕРЕНО, а не прикинуто — `docker stats` на проде 04.08.2026.
  # Боты с полным Dispatcher'ом (sales, support, hr, finance, marketing,
  # analytics, web_office, content) держат 158–170 МБ. Прежние 192m опирались
  # на оценку «90–130 МБ на импортах» и были занижены почти вдвое: восемь
  # ботов сидели на 82–88%, а stepan на 98,9% и уже уходил в swap.
  # 256m = наблюдаемые 170 × 1.5. Полтора раза, а не впритык: снимок сделан
  # в покое, а суточные задачи (P&L, сбор повестки, B2B-рассылка) дают пики выше.
  #
  # Пятерым лёгким воркерам (devops, qa, rnd, n8n_bridge, franchise) хватает
  # 55 МБ — у них нет aiogram Dispatcher. Отдельный потолок им не заводим:
  # снижение не освободит ни байта (потолки не резервируются), зато широкий
  # запас ловит утечку раньше, чем она дойдёт до хоста.
  #
  # Сумма потолков (~5.2 ГБ) превышает 4 ГБ машины — законно по той же причине:
  # фактическое потребление всего стека 2.15 ГБ. Авария была не из-за суммы,
  # а из-за `docker build` на сервере: сборку mem_limit не ограничивает вовсе.
  mem_limit: 256m
  env_file: ./apps/tgas/.env
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+asyncpg://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
    REDIS_URL: redis://redis:6379/0
    # Shared secret guarding web_office's /ingest/order bridge (empty = off).
    INGEST_SECRET: ${INGEST_SECRET:-}
    # Reverse sync: office dashboard status change -> storefront + customer.
    STOREFRONT_STATUS_URL: http://web:3000/api/orders/status
    # Catalog sync: pull the storefront catalog (master) into the office mirror.
    STOREFRONT_API_URL: http://web:3000/api
    BOT_SECRET: ${BOT_SECRET:-}
    # Ключ 2ГИС: лид-генерация и геокодер карты клиентов (shared/geo.py).
    #
    # Задан здесь, а не только в apps/tgas/.env, потому что `environment:`
    # ПЕРЕКРЫВАЕТ env_file, а не дополняет его. Пока переменной тут не было,
    # значение из apps/tgas/.env доезжало — но стоило добавить её пустой,
    # и она затёрла бы рабочий ключ. Ровно так и вышло с INGEST_SECRET.
    # Значение в корневой .env пишет деплой из GitHub Secrets.
    DGIS_API_KEY: ${DGIS_API_KEY:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - bus_tasks:/app/bus_tasks
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - mg_net
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ========================= INFRASTRUCTURE ===============================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mg_postgres
    restart: unless-stopped
    # Ниже 512m не опускать. У pgvector/pg16 дефолтный shared_buffers — 128 МБ,
    # сверху ~20 подключений (14 ботов + web + web_office + разовый db-push),
    # каждый backend это 5–10 МБ плюс work_mem. 256m перекрывается на обычной
    # нагрузке, а cgroup-OOM бьёт не по машине, а внутрь cgroup — то есть по
    # самому Postgres, роняя все backend'ы разом.
    mem_limit: 512m
    # No host port mapping — all services connect via mg_net Docker network.
    # Publishing 5432 caused "address already in use" on container recreation.
    environment:
      POSTGRES_USER: mg_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: microgreen
      # Бизнес живёт в UTC+5. Без этого CURRENT_DATE отдавал дату по UTC, и
      # операции, внесённые с полуночи до 5 утра по местному, получали вчерашнее
      # число: колонка date заполняется как DEFAULT CURRENT_DATE.
      # Уже записанные даты не пересчитываются — влияет только на новые.
      TZ: Asia/Samarkand
      PGTZ: Asia/Samarkand
    # Пояс задаём именно аргументом запуска, а не только переменной окружения:
    # timezone попадает в postgresql.conf при первичной инициализации тома
    # ('Etc/UTC'), и на уже работающей базе переменные его НЕ перебивают —
    # правка выглядела бы применённой, но CURRENT_DATE остался бы в UTC.
    # Аргументы командной строки приоритетнее postgresql.conf.
    command:
      - postgres
      - -c
      - timezone=Asia/Samarkand
      - -c
      - log_timezone=Asia/Samarkand
    volumes:
      - pg_data:/var/lib/postgresql/data
      # apps/tgas/database/init.sql СЮДА НЕ МОНТИРУЕТСЯ — см. строку 8 заголовка.
      # Схемой владеет Prisma: её накатывает сервис db-push, и web ждёт его
      # завершения. init.sql остался историческим: он создаёт products/orders/
      # order_items/employees в ДОпереименованном виде — теми колонками, что
      # теперь принадлежат витрине. А docker-entrypoint-initdb.d отрабатывает
      # при первой инициализации тома, то есть РАНЬШЕ db-push: на чистом томе
      # он занимал эти имена офисными таблицами, и дальше расходилось всё —
      # регистрация продажи, прайс-лист, зеркалирование заказов сайта.
      # Расхождение ловит `python scripts/check_schema.py` в apps/tgas.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mg_user -d microgreen"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mg_net

  redis:
    image: redis:7-alpine
    container_name: mg_redis
    restart: unless-stopped
    # 128 МБ данных (--maxmemory ниже) + сам процесс, буферы клиентов и запас на
    # fork при RDB-снимке. Впритык к maxmemory ставить нельзя — форк удваивает
    # резидентную память на время сохранения.
    mem_limit: 192m
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mg_net

  # One-shot: push the Prisma schema into the unified database, then exit.
  db-push:
    # Тот же образ, что и у db-seed: собираем его один раз, а не дважды.
    #
    # Раньше здесь стояла builder-стадия apps/web (образ mg-web-builder) —
    # полный node_modules монорепозитория, около 4 ГБ, и он ехал на сервер
    # каждую выкатку ради двух одноразовых команд. 15 августа, когда канал до
    # ghcr.io просел до 0.35 МБ/с, именно этот вес не дал деплою закончиться.
    # mg-db-tools несёт только prisma CLI, tsx и клиент — 501 МБ.
    image: ghcr.io/${GHCR_OWNER:-radjabovdiyor2-hub}/mg-db-tools:${MG_TAG:-latest}
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    container_name: mg_db_push
    working_dir: /app
    # Схема, затем заполнители — ОДНОЙ командой, а не двумя шагами в
    # инструкции: выкатка идёт без участия человека, и «не забудьте потом
    # запустить» здесь читать некому.
    #
    # `sold_at` (деловая дата) добавляется НУЛЕВОЙ — так `db push` не трогает
    # существующие строки. Значения им проставляет backfill-sold-at сразу
    # после, из `created_at`. Объяви колонку с `@default(now())` — и push
    # проставил бы момент деплоя всей истории продаж, молча.
    #
    # backfill-pos-sales восстанавливает шапки чеков, записанных до появления
    # таблицы `pos_sales`.
    #
    # backfill-product-names — по той же причине, что и sold_at: `product_name`
    # в позициях заказов и движениях склада добавлена НУЛЕВОЙ. Это снимок
    # названия на момент продажи, и нужен он ровно тогда, когда товар удалён
    # из каталога окончательно, — без него в книге продаж осталась бы
    # безымянная сумма.
    #
    # Все три скрипта идемпотентны: повторный запуск на уже заполненной базе
    # ничего не меняет, поэтому они остаются в каждой выкатке.
    command: >
      sh -c "npx prisma db push --schema=packages/database/prisma/schema.prisma --skip-generate --accept-data-loss
      && npx tsx packages/database/prisma/backfill-sold-at.ts
      && npx tsx packages/database/prisma/backfill-pos-sales.ts
      && npx tsx packages/database/prisma/backfill-product-names.ts"
    volumes:
      - ./packages/database/prisma/schema.prisma:/app/packages/database/prisma/schema.prisma:ro
    environment:
      DATABASE_URL: postgresql://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - mg_net

  # One-shot: seed the storefront catalog into microgreen_db — but ONLY if empty.
  # db-push creates the tables but no data, so a fresh prod has an empty catalog.
  # seed-if-empty runs the full seed only when product count is 0, so it never
  # overwrites admin-edited prices/stock on an already-populated shop.
  db-seed:
    image: ghcr.io/${GHCR_OWNER:-radjabovdiyor2-hub}/mg-db-tools:${MG_TAG:-latest}
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    container_name: mg_db_seed
    working_dir: /app/packages/database
    command: sh -c "npx tsx prisma/seed-if-empty.ts"
    environment:
      DATABASE_URL: postgresql://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
    depends_on:
      db-push:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - mg_net

  # ========================= WEBSITE ======================================
  web:
    image: ghcr.io/${GHCR_OWNER:-radjabovdiyor2-hub}/mg-web:${MG_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mg_web
    restart: unless-stopped
    # Здесь крутится ТОЛЬКО рантайм Next.js (standalone) — сборка уехала в CI,
    # поэтому пиковых 1,5–2,5 ГБ от `npm run build` на сервере больше нет.
    # Уточнить по факту: docker stats --no-stream.
    mem_limit: 512m
    # Published only on loopback — the server's existing system nginx proxies
    # microgreenuzbekistan.com -> 127.0.0.1:3002 (порты 3000/3001 заняты другими
    # проектами на этом сервере, поэтому наш сайт на 3002; не трогает 80/443).
    ports:
      - "127.0.0.1:3002:3000"
    env_file: .env
    environment:
      ENVIRONMENT: production
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Тот же пояс, что у postgres. Без него Node в контейнере работает в UTC,
      # а `startOfLocalDay()` (lib/revenue/salesLedger.ts) режет сутки через
      # `setHours(0,0,0,0)` — то есть по поясу процесса. Полночь UTC — это
      # 05:00 по Ташкенту: продажи с 00:00 до 05:00 попадали во вчерашний день,
      # и «Сводка» расходилась со складом, который датирует движения Postgres
      # с ПРАВИЛЬНЫМ поясом. Одна база, два представления о том, какой сегодня
      # день, — и обе стороны уверены в своей правоте.
      TZ: Asia/Samarkand
      DATABASE_URL: postgresql://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
      REDIS_URL: redis://redis:6379/0
      NEXT_PUBLIC_URL: https://microgreenuzbekistan.com
      # ПУТЬ ОБЯЗАН СОВПАДАТЬ С ТЕМ, ОТКУДА NEXT РАЗДАЁТ СТАТИКУ.
      # Здесь стояло /data/uploads, и том монтировался туда же — но
      # standalone-сервер отдаёт файлы из apps/web/public, куда том не
      # попадал. Фотография, загруженная в админке, ложилась на диск и тут же
      # отдавала 404: записали в один каталог, ищем в другом. На bare-metal
      # этого не видно — там deploy.sh сносит apps/web/public/uploads и вешает
      # на его место симлинк на тот же хостовый каталог (фаза 5). Здесь то же
      # самое, только средствами compose.
      UPLOADS_DIR: /app/apps/web/public/uploads
      # Состояние, которое обязано пережить деплой: пароль владельца,
      # привязанные passkeys и журнал аудита. Без тома они лежали в слое
      # образа и стирались при каждой выкатке — а смена утёкшего пароля
      # откатывалась к прежнему значению из .env молча.
      STATE_DIR: /data/state
      AUDIT_LOG_DIR: /data/state/logs
      # Bridge app orders/customers into the tgas AI-office CRM (`microgreen` DB).
      OFFICE_INGEST_URL: http://web_office:8050/ingest/order
      OFFICE_STATUS_URL: http://web_office:8050/ingest/order-status
      OFFICE_CUSTOMER_URL: http://web_office:8050/ingest/customer
      # Брифинг журнала тянет Google Trends из офиса (/api/magazine/brief).
      WEB_OFFICE_URL: http://web_office:8050
      # Модель веба: флагман, тот же, что у офиса и бота витрины. Значение
      # здесь ЯВНОЕ, чтобы веб можно было отдельно перевести на модель дешевле
      # через WEB_OPENAI_MODEL, не задевая остальных.
      #
      # ⚠️ Имя обязано совпадать с дефолтом кода
      # (apps/web/src/lib/ai/models.ts). Раньше compose подставлял `gpt-4o`,
      # код ждал `gpt-4o-mini`, а офис — третье; одна из моделей аккаунту не
      # принадлежала, и каждый вызов падал.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${WEB_OPENAI_MODEL:-gpt-5.5}
      INGEST_SECRET: ${INGEST_SECRET:-}
      # Shared secret for storefront-bot -> web admin API calls (empty = off).
      BOT_SECRET: ${BOT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Вход владельца в админку кнопкой из Telegram (/api/auth/telegram-admin).
      # Подпись initData ставит бот, открывший Mini App, — карточки шлёт Стёпан,
      # поэтому его токен нужен и витрине. Пустой список владельцев = дверь
      # закрыта, остаётся вход по паролю. Держать в паре с ADMIN_TELEGRAM_IDS
      # офиса: это один и тот же человек, просто список читают два сервиса.
      STEPAN_BOT_TOKEN: ${STEPAN_BOT_TOKEN:-}
      OWNER_TELEGRAM_IDS: ${OWNER_TELEGRAM_IDS:-}
    volumes:
      # Persist + serve uploaded product images (host dir, kept across deploys).
      # Монтируется ПОВЕРХ apps/web/public/uploads — туда же, куда смотрит
      # Next, иначе «persist» работал, а «serve» нет (см. UPLOADS_DIR выше).
      # Запечённые в образ картинки сидера этот том закрывает — ровно то же
      # происходит на bare-metal, где deploy.sh их удаляет перед сборкой:
      # видимые товары ссылаются на /catalog/*, он лежит отдельно и цел.
      - ${HOST_UPLOADS_DIR:-/home/ubuntu/microgreen-uploads}:/app/apps/web/public/uploads
      # Пароль владельца, passkeys и журнал аудита (STATE_DIR).
      - mg_web_state:/data/state
    depends_on:
      postgres:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mg_net

  # Customer-facing storefront bot (aiogram + Gemini) — the only client bot.
  bot:
    image: ghcr.io/${GHCR_OWNER:-radjabovdiyor2-hub}/mg-bot:${MG_TAG:-latest}
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: mg_storefront_bot
    restart: unless-stopped
    # Тот же профиль, что у ботов офиса: замер 04.08.2026 дал 167 МБ, потолок
    # 167 × 1.5. На прежних 192m контейнер сидел на 86,7%.
    mem_limit: 256m
    env_file: .env
    environment:
      ENVIRONMENT: production
      TZ: Asia/Samarkand
      DATABASE_URL: postgresql://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
      # Корзины живут в Redis. Без этой строки сервис наследовал из общего
      # .env хостовое значение `redis://localhost:6379/0` — а внутри
      # контейнера по localhost Redis нет. Ping падал, cart_storage тихо
      # переходил на файл `/app/data/carts.json`, тома у сервиса нет, и
      # каждый деплой (то есть каждый push в main) пересоздавал контейнер
      # вместе со всеми корзинами и незавершёнными оформлениями. Клиент
      # возвращался к пустой корзине без единого объяснения.
      REDIS_URL: redis://redis:6379/0
      WEB_API_URL: http://web:3000/api
      # Весь ИИ витрины идёт через OpenAI (mg_ai): текст, зрение, распознавание
      # речи и озвучка. Без ключа бот не упадёт, но будет отвечать заглушкой —
      # прописываем явно, как у веб-сервиса, чтобы это не осталось незамеченным.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      # Must match the web service's BOT_SECRET so admin API calls authorize.
      BOT_SECRET: ${BOT_SECRET:-}
      # Степан-менеджер (@MG_PM1_bot) — для уведомлений о заказах
      STEPAN_BOT_TOKEN: ${STEPAN_BOT_TOKEN:-}
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mg_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ========================= tgas — INTERNAL AI OFFICE ====================
  web_office:
    <<: *tgas-bot
    container_name: mg_web_office
    command: python -m uvicorn web_office.main:app --host 0.0.0.0 --port 8050
    ports:
      - "127.0.0.1:8050:8050"

  stepan:
    <<: *tgas-bot
    container_name: mg_stepan
    command: python -m bots.stepan_bot.main
    # Самый тяжёлый в офисе: 190 МБ против 158–170 у остальных. Он же диспетчер —
    # держит состояние совещаний, инструменты всех отделов и историю диалога с
    # владельцем. На потолке 192m сидел на 98,9% и вытеснялся в swap: рестарта
    # не было только потому, что Docker по умолчанию даёт контейнеру ещё один
    # mem_limit свопа. Это не запас прочности, а уже оплаченная деградация.
    mem_limit: 320m

  sales:
    <<: *tgas-bot
    container_name: mg_sales
    command: python -m bots.sales_bot.main

  support:
    <<: *tgas-bot
    container_name: mg_support
    command: python -m bots.support_bot.main

  hr:
    <<: *tgas-bot
    container_name: mg_hr
    command: python -m bots.hr_bot.main

  finance:
    <<: *tgas-bot
    container_name: mg_finance
    command: python -m bots.finance_bot.main

  marketing:
    <<: *tgas-bot
    container_name: mg_marketing
    command: python -m bots.marketing_bot.main

  analytics:
    <<: *tgas-bot
    container_name: mg_analytics
    command: python -m bots.analytics_bot.main

  content:
    <<: *tgas-bot
    container_name: mg_content
    command: python -m bots.content_bot.main
    # Потолок выше общего: shared/trends.py в get_trending_queries лениво
    # импортирует pytrends, а тот тянет pandas — +60–80 МБ на время суточного
    # сбора трендов. Замер 04.08.2026 показал 159 МБ, но снят он был ДО сбора
    # повестки, то есть без pandas в памяти; реальный пик ≈240 МБ.
    mem_limit: 320m

  qa:
    <<: *tgas-bot
    container_name: mg_qa
    command: python -m bots.qa_bot.main

  rnd:
    <<: *tgas-bot
    container_name: mg_rnd
    command: python -m bots.rnd_bot.main

  # devops needs the Docker socket + backups dir (overrides anchor volumes)
  devops:
    <<: *tgas-bot
    container_name: mg_devops
    command: python -m bots.devops_bot.main
    volumes:
      - bus_tasks:/app/bus_tasks
      - ./backups:/app/backups

  # franchise — планировщик: ежедневная сводка для франчайзи по городам.
  # Telegram-токен не нужен — это воркер без Dispatcher.
  franchise:
    <<: *tgas-bot
    container_name: mg_franchise
    command: python -m bots.franchise_bot.main

  # n8n_bridge reaches an (optional) external n8n on the host
  n8n_bridge:
    <<: *tgas-bot
    container_name: mg_n8n_bridge
    command: python -m bots.n8n_bridge.main
    # ⚠️ `environment:` ЗАМЕНЯЕТ блок из якоря целиком, а не дополняет его:
    # YAML-слияние не делает глубокого merge. Раньше здесь были только четыре
    # строки ниже, и сервис молча терял ENVIRONMENT, INGEST_SECRET,
    # STOREFRONT_API_URL, BOT_SECRET и STOREFRONT_STATUS_URL. Сегодня мост
    # заказов не создаёт, поэтому это не проявлялось, — но стоило добавить ему
    # любой вызов витрины, и он получил бы пустой секрет и 401.
    # Поэтому общий набор повторён явно.
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://mg_user:${POSTGRES_PASSWORD}@postgres:5432/microgreen
      REDIS_URL: redis://redis:6379/0
      INGEST_SECRET: ${INGEST_SECRET:-}
      STOREFRONT_API_URL: http://web:3000/api
      STOREFRONT_STATUS_URL: http://web:3000/api/orders/status
      BOT_SECRET: ${BOT_SECRET:-}
      N8N_ASSISTANT_WEBHOOK: http://host.docker.internal:5678/webhook/assistant
      N8N_TIMEOUT: "120"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ========================= EDGE (nginx + TLS) ===========================
  # Opt-in only: `docker compose --profile edge up -d`.
  # On the shared multi-tenant server the system nginx already owns 80/443,
  # so by default we DON'T start these (web is reached via 127.0.0.1:3000).
  nginx:
    image: nginx:alpine
    container_name: mg_nginx
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - mg_net

  certbot:
    image: certbot/certbot
    container_name: mg_certbot
    profiles: ["edge"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pg_data:
  redis_data:
  bus_tasks:
  # Состояние витрины, переживающее деплой: пароль владельца, passkeys, аудит.
  mg_web_state:

networks:
  mg_net:
    driver: bridge

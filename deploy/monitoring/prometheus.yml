# Prometheus scrape config — Microgreen Uzbekistan (DD §4.8).
#
# Цели внутри docker-сети mg_net, поэтому адресуемся по именам сервисов.
# Веб-приложение отдаёт /api/metrics только по Bearer-токену (METRICS_TOKEN),
# иначе метрики с оборотами и числом заказов были бы открыты.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    project: microgreen

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Next.js: бизнес-показатели + счётчики авторизации.
  - job_name: web
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['web:3000']

  - job_name: node
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']
